; PlatformIO Project Configuration File
;
; Diagnostic build for SI4684 FM/DAB startup investigation.
; Based on commit 492ea47.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DPNG_MAX_BUFFERED_PIXELS=2600
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=-1
    -DSPI_FREQUENCY=27000000
    -DSMOOTH_FONT=1

lib_deps =
    paulstoffregen/Time
    bodmer/TFT_eSPI
    bitbank2/PNGdec
    crankyoldgit/IRremoteESP8266
